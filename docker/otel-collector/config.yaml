receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      network: {}
      # Removed disk/paging/process to save memory unless you specifically need them

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

  filelog:
    include: [ /var/lib/docker/containers/*/*-json.log ]
    exclude:
      - /var/lib/docker/containers/*otel-collector*/*.log
    start_at: end
    include_file_path: true
    operators:
      - id: container-parser
        type: container
        format: docker
        add_metadata_from_filepath: false
        add_metadata_from_line_config: false

processors:
  # 1. Memory limiter MUST be first
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # 2. DROP COLLECTOR LOGS TO STOP THE LOOP
  filter/exclude_otel:
    logs:
      log_record:
        - 'resource.attributes["service.name"] == "otelcol-contrib"'
        - 'resource.attributes["container.name"] == "otel-collector"'
        - 'body == ""'

  resourcedetection:
    detectors: [ env, system, docker ]
    timeout: 2s
    system:
      hostname_sources: [ os ]

  batch:
    send_batch_size: 1000
    timeout: 10s

exporters:
  otlp:
    endpoint: "${SIGNOZ_ENDPOINT:-https://signoz.cloud}"
    headers:
      signoz-ingestion-key: "${SIGNOZ_INGESTION_KEY}"

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, resourcedetection, batch ]
      exporters: [ otlp ]
    metrics:
      receivers: [ otlp, hostmetrics, docker_stats ]
      processors: [ memory_limiter, resourcedetection, batch ]
      exporters: [ otlp ]
    logs:
      receivers: [ otlp, filelog ]
      # Add the filter here to stop the feedback loop
      processors: [ memory_limiter, filter/exclude_otel, resourcedetection, batch ]
      exporters: [ otlp ]
